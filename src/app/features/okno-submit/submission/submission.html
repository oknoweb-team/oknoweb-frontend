<div class="block w-full md:flex place-items-center">
    <div class="md:w-1/3">
      <img
        src="{{coverUrl()}}"
        alt="loading..."
        class="object-cover mt-2 mb-2 border-4 border-blue-700 w-full h-full font-main font-bold text-center"
      >
    </div>
  <div class="md:w-2/3 md:ml-4">
    <div class="font-main leading-8 text-[clamp(2rem,10vw,3rem)] text-center md:text-4xl text-[#000555] mt-5 ">
      <h2><b> {{ submission.name }}</b></h2>
    </div>

    <div class="font-main text-[20px] leading-8 text-center md:text-2xl text-[#000555] mt-1 mb-7">
      <h2><b> by {{ this.submission.author }}</b></h2>
    </div>

    <div class="font-main text-1xl text-balance text-center md:text-2xl text-[#000555] break-all mb-5">
      <h3 class="break-normal"><b> {{ submission.additionalInfo }} </b></h3>
    </div>

    <div class="font-main text-1xl text-center md:text-2xl text-[#000555] outline-2 outline-pink-400 break-all">
      <a href="{{ submission.link }}" target="_blank"><b> {{ submission.link }} </b></a>
    </div>

    <div class="pt-2 pb-2">
      <app-submission-reviews [submission]="submission"></app-submission-reviews>
    </div>


    <div class="text-center font-main font-bold">{{ submission.date }}</div>

    <div class="p-3 flex flex-wrap justify-center w-full">
      @for (tag of submission.tags; track $index) {
        <div class="bg-blue-600 text-white font-main text-sm md:text-xl px-2 mx-1 mb-1 md:mb-2 font-bold border-3 border-blue-600">
          {{ tag }}
        </div>
      }
    </div>
  </div>
</div>
