@if (submissions.length > 0) {
  <div class="overflow-hidden whitespace-nowrap" (mouseenter)="marqueePaused = true" (mouseleave)="marqueePaused = false">
    <div class="inline-flex gap-3 marquee-content" [class.marquee-paused]="marqueePaused">
      @for (sub of submissions.concat(submissions); track $index) {
        <a
          [routerLink]="'/submissions/' + sub.id"
          class="inline-block"
          (mouseenter)="showPreview(sub, $event)"
          (mouseleave)="scheduleHide()"
        >
          <span class="inline-block font-main font-bold text-xl md:text-2xl text-blue-700 bg-white border-4 border-b-8 border-r-8 border-blue-700 hover:bg-blue-700 hover:text-white px-4 py-2 cursor-pointer whitespace-nowrap transition-colors">
            {{ sub.name }}
          </span>
        </a>
      }
    </div>
  </div>

  @if (preview(); as p) {
    <div
      class="preview-popup fixed z-50 bg-white border-10 border-blue-700 border-double p-3 pointer-events-none overflow-hidden"
      [style.left.px]="p.left"
      [style.top.px]="p.top"
      [style.width.px]="p.width"
      [style.max-height.px]="p.maxHeight"
      [style.transform]="p.above ? 'translateY(-100%)' : null"
    >
      <div class="flex items-start gap-3">
        <div class="w-[55%] shrink-0 border-4 border-blue-700 bg-blue-50 overflow-hidden">
          @if (cover(); as url) {
            <img [src]="url" [alt]="p.submission.name" class="block w-full aspect-video object-cover" />
          } @else {
            <div class="flex w-full aspect-video items-center justify-center font-main text-blue-700 text-lg">
              {{ cover() === null ? 'нет обложки' : 'загрузка...' }}
            </div>
          }
        </div>

        <div class="flex-1 min-w-0 overflow-hidden font-main text-blue-700 text-lg leading-tight break-words line-clamp-6">
          {{ p.submission.additionalInfo }}
        </div>
      </div>
    </div>
  }

  <br />
}
