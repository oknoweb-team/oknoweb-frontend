<div class="w-screen h-screen overflow-hidden">
  @if (isLoading()) {
    <div class="fixed inset-0 z-10 flex items-center justify-center bg-blue-900 text-orange text-xl">
      загружаем КАРНАВАЛ...
    </div>
  }

  <iframe
    [src]="'https://oknocarnival.ru/webgl/index.html' | safe: 'resourceUrl'"
    class="border-0 w-full h-full"
    allowfullscreen="true"
    (load)="onLoaded()"
  >
  </iframe>
</div>
