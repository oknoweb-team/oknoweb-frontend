<div class="absolute top-0 left-0 w-full h-full overflow-hidden bg-black">
  @if (isLoading()) {
    <div class="font-main absolute inset-0 flex flex-col items-center justify-center bg-black text-white">
      <p class="mb-3 text-3xl">Загружаем КАРНАВАЛ... Подождите.. пожалуйста</p>
    </div>
  }
  <iframe
    [src]="'https://oknocarnival.ru/webgl/index.html' | safe: 'resourceUrl'"
    width="100%"
    height="100%"
    (load)="onLoaded()"
    allowfullscreen="true">
  </iframe>
</div>
