<div class="absolute top-0 left-0 w-full h-full overflow-hidden bg-black">
  <div class="text-center text-2xl mt-4 mb-4 text-white font-main text-bold">карнавал</div>
  @if (progress() < 1) {
    <div class="font-main absolute inset-0 flex flex-col items-center justify-center bg-black text-white">
      <p class="mb-3 text-sm opacity-80">КАРНАВАЛ… Карнавал… карнавал… {{ progress() * 100 | number:'1.0-0' }}%</p>
      <div class="w-2/3 h-2 bg-white/20 rounded overflow-hidden">
        <div class="h-full bg-orange-500 transition-[width] duration-200"
          [style.width.%]="progress() * 100"></div>
        </div>
    </div>
  }
  <canvas #canvas id="unity-canvas"></canvas>
</div>
