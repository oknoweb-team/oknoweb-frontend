<!DOCTYPE html>
<html lang="en-us">
  <head>
    <script>
    (function () {
      window.__blockPointerLock = false;
      var orig = Element.prototype.requestPointerLock;
      Element.prototype.requestPointerLock = function () {
        console.log('[PL] requestPointerLock, blocked=' + window.__blockPointerLock);
        if (window.__blockPointerLock) return Promise.resolve();
        return orig.apply(this, arguments);
      };
      document.addEventListener('pointerlockchange', function () {
        var locked = !!document.pointerLockElement;
        console.log('[PL] pointerlockchange locked=' + locked + ' blocked=' + window.__blockPointerLock);
        if (window.__blockPointerLock && locked) document.exitPointerLock();
      });
    })();
    </script>
